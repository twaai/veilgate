name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Demo runs
        run: python demo.py

      - name: Unit tests
        run: python tests/test_veilgate.py

      - name: HTTP boundary tests
        run: python tests/test_server.py

      - name: MCP shim tests
        run: python tests/test_mcp_shim.py

      - name: Scripted red team
        run: |
          out=$(python benchmarks/redteam.py)
          echo "$out"
          echo "$out" | grep -q "10/10 defended"

      - name: Relational benchmark is reproducible
        run: |
          python benchmarks/relational.py > /tmp/a.txt
          python benchmarks/relational.py > /tmp/b.txt
          diff /tmp/a.txt /tmp/b.txt
